[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgresql.log
stderr_logfile=/var/log/postgresql-err.log

[program:mcp-server]
command=python3 /app/scripts/hipocampo_mcp_server.py --http 7860 --host 0.0.0.0
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/var/log/mcp-server.log
stderr_logfile=/var/log/mcp-server-err.log
