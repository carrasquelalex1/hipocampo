name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to HF Spaces
        continue-on-error: true
        run: |
          git push https://alexbell1:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/alexbell1/hipocampo-mcp main --force || echo "HF Spaces push skipped (pre-receive hook)
